[workspace]
members = [
    "ext/behavior_machines_native/circuit",
    "ext/behavior_machines_native/core",
    "ext/behavior_machines_native/ffi",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
